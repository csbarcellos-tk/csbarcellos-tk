<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <style>
    .win   { fill: #0d0d0d; stroke: #ff3333; stroke-opacity: .35; }
    .bar   { fill: #161616; }
    .t     { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; }
    .p     { fill: #ff3333; font-weight: 700; }
    .c     { fill: #f2f2f2; }
    .o     { fill: #9a9a9a; }
    .a     { fill: #ff6b6b; }
    .ttl   { fill: #777; font-size: 12px; }
    .line  { opacity: 0; clip-path: inset(0 100% 0 0); }
    .out   { opacity: 0; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .l1 { animation: show 0s .3s forwards, type 1s steps(12) .3s forwards; }
    .o1 { animation: show .4s 1.5s forwards; }
    .l2 { animation: show 0s 2.2s forwards, type 1.2s steps(16) 2.2s forwards; }
    .o2 { animation: show .4s 3.6s forwards; }
    .l3 { animation: show 0s 4.3s forwards, type 1s steps(14) 4.3s forwards; }
    .o3 { animation: show .4s 5.5s forwards; }
    .l4 { animation: show 0s 6.2s forwards, type 1s steps(16) 6.2s forwards; }
    .o4 { animation: show .4s 7.4s forwards; }
    .cur { opacity: 0; animation: show 0s 8s forwards, blink 1s steps(1) 8s infinite; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { stroke-opacity: .25; } 50% { stroke-opacity: .7; } }
  </style>

  <rect class="win glow" x="1" y="1" width="818" height="328" rx="12" stroke-width="1.5"/>
  <path class="bar" d="M13 1h794a12 12 0 0 1 12 12v23H1V13A12 12 0 0 1 13 1z"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text class="t ttl" x="410" y="22" text-anchor="middle">cauã@salvador: ~</text>

  <!-- 1 -->
  <text class="t line l1" x="24" y="66"><tspan class="p">❯ </tspan><tspan class="c">whoami</tspan></text>
  <text class="t out o1" x="24" y="90"><tspan class="a">Cauã Barcellos</tspan><tspan class="o"> · dev full stack jr · Salvador, BA</tspan></text>

  <!-- 2 -->
  <text class="t line l2" x="24" y="126"><tspan class="p">❯ </tspan><tspan class="c">cat stack.txt</tspan></text>
  <text class="t out o2" x="24" y="150"><tspan class="o">java · spring boot · react · vite · tailwind · postgresql · python</tspan></text>

  <!-- 3 -->
  <text class="t line l3" x="24" y="186"><tspan class="p">❯ </tspan><tspan class="c">ls ~/projetos</tspan></text>
  <text class="t out o3" x="24" y="210"><tspan class="o">apps-web/  apis-rest/  bots-e-automacao/  apps-mobile/  landing-pages/</tspan></text>

  <!-- 4 -->
  <text class="t line l4" x="24" y="246"><tspan class="p">❯ </tspan><tspan class="c">./status --now</tspan></text>
  <text class="t out o4" x="24" y="270"><tspan class="a">● </tspan><tspan class="c">aberto a freelas e novas oportunidades</tspan></text>

  <!-- cursor -->
  <text class="t cur" x="24" y="306"><tspan class="p">❯ </tspan><tspan class="c">█</tspan></text>
</svg>
