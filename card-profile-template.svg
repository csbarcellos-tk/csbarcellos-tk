<svg xmlns="http://www.w3.org/2000/svg" width="400" height="130" viewBox="0 0 400 130">
  <style>
    .card { fill:#0d0d0d; stroke:#ff3333; stroke-opacity:.25; animation: glow 3s ease-in-out 0.75s infinite; }
    @keyframes glow { 0%,100% { stroke-opacity:.2 } 50% { stroke-opacity:.8 } }
    .wrap { opacity:0; animation: in .6s ease-out 0.75s forwards; }
    @keyframes in { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: translateY(0) } }
    .title { font: 700 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill:#ff3333; }
    .desc  { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill:#cccccc; }
    .lang  { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill:#999; }
    .bar   { animation: pulse 2s ease-in-out 0.75s infinite; }
    @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  </style>
  <rect class="card" x="1" y="1" width="398" height="128" rx="10" stroke-width="1.5"/>
  <rect class="bar" x="1" y="18" width="4" height="94" rx="2" fill="#ff3333"/>
  <g class="wrap">
